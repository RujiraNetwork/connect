[package]
name = "rujira-monero-kernel"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.118"
curve25519-dalek = { version = "=4.1.3", features = ["zeroize"] }
monero-ed25519 = { git = "https://github.com/monero-oxide/monero-oxide", rev = "731657ae3385be667abb556266369a497bc86f13" }
monero-bulletproofs = { git = "https://github.com/monero-oxide/monero-oxide", rev = "731657ae3385be667abb556266369a497bc86f13" }
monero-clsag = { git = "https://github.com/monero-oxide/monero-oxide", rev = "731657ae3385be667abb556266369a497bc86f13" }
monero-oxide = { git = "https://github.com/monero-oxide/monero-oxide", rev = "731657ae3385be667abb556266369a497bc86f13" }
rand_chacha = "=0.3.1"
rand_core = "=0.6.4"
getrandom = { version = "0.2", features = ["js"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "=0.4.3"
sha3 = "=0.10.8"
zeroize = "1"

[profile.release]
opt-level = 3
lto = true
panic = "abort"
overflow-checks = true
