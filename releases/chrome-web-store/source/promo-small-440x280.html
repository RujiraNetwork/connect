      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
      }
      body {
        background: #0c0a0f;
        color: #ffffff;
        font-family: Barlow, sans-serif;
        overflow: hidden;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .brand img {
        width: 44px;
        height: 44px;
      }
      .brand strong {
        display: block;
        font:
          600 17px Montserrat,
          sans-serif;
        letter-spacing: 4px;
      }
      .brand span {
        display: block;
        margin-top: 4px;
        font:
          400 13px Barlow,
          sans-serif;
        letter-spacing: 5.4px;
        color: #90a4ae;
      }
      .credit {
        color: #90a4ae;
        font-size: 17px;
      }

      .tile {
        width: 440px;
        height: 280px;
        padding: 29px 32px;
        position: relative;
        background:
          radial-gradient(ellipse at 110% 85%, #8436f539 0%, transparent 61%),
          #0c0a0f;
      }
      .tile::after {
        content: "";
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: linear-gradient(90deg, #8436f5, #d615eb);
      }
      .brand img {
        width: 38px;
        height: 38px;
      }
      .brand strong {
        font-size: 14px;
        letter-spacing: 3.4px;
      }
      .brand span {
        font-size: 10px;
        letter-spacing: 4.65px;
      }
      h1 {
        margin: 29px 0 11px;
        font:
          600 29px/1.19 Montserrat,
          sans-serif;
        letter-spacing: -0.8px;
      }
      .devices {
        margin: 0;
        color: #b4b0c0;
        font-size: 17px;
      }
      .credit {
        margin-top: 24px;
        font-size: 13px;
      }
    </style>
