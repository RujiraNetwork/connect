      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
      }
      body {
        background: #0c0a0f;
        color: #ffffff;
        font-family: Barlow, sans-serif;
        overflow: hidden;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .brand img {
        width: 44px;
        height: 44px;
      }
      .brand strong {
        display: block;
        font:
          600 17px Montserrat,
          sans-serif;
        letter-spacing: 4px;
      }
      .brand span {
        display: block;
        margin-top: 4px;
        font:
          400 13px Barlow,
          sans-serif;
        letter-spacing: 5.4px;
        color: #90a4ae;
      }
      .credit {
        color: #90a4ae;
        font-size: 17px;
      }

      .tile {
        width: 1400px;
        height: 560px;
        position: relative;
        padding: 51px 64px;
        background:
          radial-gradient(ellipse at 98% 50%, #8436f534 0%, transparent 65%),
          #0c0a0f;
      }
      .tile::after {
        content: "";
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: linear-gradient(90deg, #8436f5, #d615eb);
      }
      .copy {
        width: 622px;
      }
      h1 {
        margin: 42px 0 23px;
        font:
          600 48px/1.16 Montserrat,
          sans-serif;
        letter-spacing: -1.8px;
      }
      .detail {
        margin: 0;
        font-size: 25px;
        line-height: 1.4;
        color: #b4b0c0;
      }
      .local {
        margin-top: 24px;
        color: #90a4ae;
        font-size: 21px;
      }
      .credit {
        position: absolute;
        bottom: 44px;
        left: 64px;
      }
      .product {
        position: absolute;
        left: 760px;
        top: 22px;
        width: 566px;
        height: 516px;
        overflow: hidden;
        border: 1px solid #ffffff1a;
        border-radius: 20px;
        background: #0c0a0f;
        box-shadow: 0 10px 35px #00000040;
      }
      .product img {
        display: block;
        width: 566px;
        height: auto;
      }
    </style>
