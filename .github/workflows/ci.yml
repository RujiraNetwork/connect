name: Quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extension-and-test-results
          path: |
            packages/extension/dist
            test-results
  monero-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y build-essential cmake pkg-config libboost-all-dev libssl-dev libunbound-dev libsodium-dev libzmq3-dev libpgm-dev libnorm-dev libhidapi-dev libusb-1.0-0-dev libprotobuf-dev protobuf-compiler libreadline-dev libexpat1-dev python3-venv
      - run: python3 -m venv /tmp/rujira-trezor && /tmp/rujira-trezor/bin/pip install protobuf==3.20.3
      - run: pnpm companion:build-engine --source /tmp/rujira-monero --jobs 2
        env:
          TREZOR_PYTHON: /tmp/rujira-trezor/bin/python
      - uses: actions/upload-artifact@v4
        with:
          name: monero-engine-linux
          path: /tmp/rujira-monero/build/rujira/bin/monero-wallet-*
